<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clouded Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#12131A; --mute:#5A6073; --line:#D9DCE8;
  --accent:#3D36F5; --accent-ink:#FFFFFF; --danger:#C2253A; --tl:91%; --ts:62%;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F15; --surface:#171923; --ink:#ECEEF6; --mute:#9AA0B8; --line:#2A2D3C;
    --accent:#908AFF; --accent-ink:#0E0F15; --danger:#FF7A8A; --tl:19%; --ts:38%;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F15; --surface:#171923; --ink:#ECEEF6; --mute:#9AA0B8; --line:#2A2D3C;
  --accent:#908AFF; --accent-ink:#0E0F15; --danger:#FF7A8A; --tl:19%; --ts:38%;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0}
.logo{max-height:56px;max-width:170px;object-fit:contain;border-radius:10px}
.wordmark{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none;gap:20px;margin-right:12px}
.nav a{text-decoration:none;color:var(--mute);font-weight:500}
.nav a:hover{color:var(--ink)}
@media(min-width:760px){.nav{display:flex}}
.ib{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ib .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.ib .n:empty{display:none}

/* hero */
.hero{padding:40px 0 24px;display:grid;gap:28px}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr;align-items:center;padding:64px 0 40px;gap:48px}}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.4vw,64px);line-height:1.02;letter-spacing:-.035em;margin:0 0 18px;max-width:14ch;text-wrap:balance}
.hero p{color:var(--mute);margin:0 0 24px;max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.feature{position:relative;border:0;padding:0;text-align:left;border-radius:28px;overflow:hidden;min-height:340px;background:hsl(var(--h) var(--ts) var(--tl));display:grid;align-content:end}
.feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.feature .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:120px;color:hsl(var(--h) 50% 50% / .35)}
.feature .fi{position:relative;padding:22px;background:linear-gradient(to top,hsl(var(--h) var(--ts) var(--tl)) 40%,transparent)}
.fnum{font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,84px);line-height:.9;letter-spacing:-.04em}
.flabel{font-weight:500;color:var(--mute)}
.fname{margin-top:8px;font-weight:600}

/* sections */
section{padding:44px 0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.4vw,38px);letter-spacing:-.03em;line-height:1.1;margin:0 0 8px}
.lead{color:var(--mute);margin:0 0 24px;max-width:56ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.search{flex:1 1 220px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex:1 1 100%;scrollbar-width:thin}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .media{display:block;width:100%;aspect-ratio:1/1;border:0;padding:0;background:hsl(var(--h) var(--ts) var(--tl));position:relative;overflow:hidden}
.card .media img{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;width:100%;height:100%;font-family:var(--display);font-weight:800;font-size:64px;color:hsl(var(--h) 50% 50% / .45)}
.card.out .media{opacity:.55}
.tag{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px}
.fav{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;color:var(--mute)}
.fav.on{color:#E0245E}
.card .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cat{font-size:13px;color:var(--mute)}
.card h3{margin:0;font-size:17px;line-height:1.25;font-weight:600}
.puffs{font-size:14px;color:var(--mute)}
.puffs b{font-family:var(--display);font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:600}
.empty{color:var(--mute);padding:28px 0}

/* why + faq */
.why{display:grid;gap:0;border-top:1px solid var(--line)}
.why div{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
@media(min-width:760px){.why{grid-template-columns:1fr 1fr;column-gap:40px}}
.why h3{margin:0;font-size:18px}
.why p{margin:0;color:var(--mute)}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--mute)}
details[open] summary::after{content:"–"}
details p{margin:10px 0 0;color:var(--mute);max-width:62ch}
footer{border-top:1px solid var(--line);padding:32px 0 48px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
footer a,footer button.lnk{background:none;border:0;padding:6px 0;color:inherit;text-decoration:underline;font-size:inherit}
.age{margin-left:auto;font-weight:600;color:var(--ink)}

/* overlay */
.scrim{position:fixed;inset:0;background:rgba(8,9,14,.55);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,92vw);transform:translate(-50%,-50%);border-radius:24px;animation:none}.sheet.wide{width:min(820px,94vw)}}
.sheet h2{font-size:26px}
.x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px}
.pimg{border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:hsl(var(--h) var(--ts) var(--tl));margin:8px 0 16px}
.pimg img{width:100%;height:100%;object-fit:cover}
.flav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.flav span{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:14px}
.desc{white-space:pre-line;color:var(--mute)}
.cl{display:grid;gap:10px;margin:16px 0}
.ci{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.out{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.note{font-size:14px;color:var(--mute)}

.pay{display:flex;gap:8px;flex-wrap:wrap}
.codebox{border:1px dashed var(--line);border-radius:14px;padding:14px;margin:14px 0;text-align:center}
.code{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,34px);letter-spacing:.06em;margin:4px 0 10px;word-break:break-all}
/* admin */
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:14px;font-weight:600}
.fld input,.fld textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;width:100%}
.fld textarea{min-height:96px;resize:vertical}
.two{display:grid;gap:12px}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.al{display:grid;gap:8px;margin:12px 0 24px}
.ar{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.ar .t{width:48px;height:48px;border-radius:8px;overflow:hidden;background:hsl(var(--h) var(--ts) var(--tl))}
.ar .t img{width:100%;height:100%;object-fit:cover}
.ar .b{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.pub{position:sticky;bottom:calc(-1 * (22px + env(safe-area-inset-bottom,0px)));background:var(--surface);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prev{margin-top:8px}.prev img{max-height:110px;border-radius:10px}

/* gate + toast */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
.gate .box{width:min(440px,100%);text-align:center}
.gate h1{font-family:var(--display);font-size:clamp(34px,8vw,48px);letter-spacing:-.03em;line-height:1.05;margin:0 0 12px}
.gate p{color:var(--mute);margin:0 0 24px}
.gate .actions{justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:200;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="site"></div>
<div id="overlay"></div>
<div id="gate"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var state=JSON.parse($('#state').textContent);
var draft=null,dirty=0,editingId=null,pendingImg='',cat='Wszystkie',q='';
var mem={};
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]==null?null:mem[k]}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
function readJson(k,d){try{var v=JSON.parse(store.get(k));return v==null?d:v}catch(e){return d}}
var favs=readJson('favs',[]);
var cart=readJson('cart',[]);

var HEART='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21C7 17 3 13.5 3 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 9 2.5C21 13.5 17 17 12 21z" fill="currentColor"/></svg>';
var BAG='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function hue(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%360}return h}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}
function money(n){return (Number(n)||0).toFixed(2).replace('.',',')+' zł'}
function priceLabel(p){return p.price>0?money(p.price):'Cena na Discordzie'}
function puffsNum(p){
  var s=String(p||'').replace(/\s/g,'').toLowerCase();
  if(!s)return '';
  var m=s.match(/^(\d+(?:[.,]\d+)?)k$/);
  var n=m?Math.round(parseFloat(m[1].replace(',','.'))*1000):(/^\d+$/.test(s)?parseInt(s,10):NaN);
  return isNaN(n)?String(p):n.toLocaleString('pl-PL');
}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function byId(id){return state.products.filter(function(p){return p.id===id})[0]}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},4000)}

/* ---------- strona ---------- */
function media(p){return p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">':'<span class="ph">'+esc(initials(p.name))+'</span>'}

function renderSite(){
  var s=state.shop;
  document.title=s.name||'Sklep';
  var brand=s.logo?'<img class="logo" src="'+esc(s.logo)+'" alt="'+esc(s.name)+'">':'<span class="wordmark">'+esc(s.name)+'</span>';
  var f=state.products[0];
  var feature=f?'<button class="feature" data-act="open" data-id="'+esc(f.id)+'" style="--h:'+hue(f.category||f.name)+'" aria-label="Zobacz: '+esc(f.name)+'">'+media(f)+'<div class="fi">'+(f.puffs?'<div class="fnum">'+esc(puffsNum(f.puffs))+'</div><div class="flabel">buchów</div>':'')+'<div class="fname">'+esc(f.name)+'</div></div></button>':'';
  $('#site').innerHTML=
  '<header class="top"><div class="wrap"><a class="brand" href="#top" aria-label="'+esc(s.name)+'">'+brand+'</a>'+
    '<nav class="nav" aria-label="Menu"><a href="#sklep">Sklep</a><a href="#jak">Jak zamówić</a><a href="#faq">Pytania</a></nav>'+
    (s.discord?'<a class="btn sm ghost" href="'+esc(s.discord)+'" target="_blank" rel="noopener">Discord</a>':'')+
    '<button class="ib" data-act="favfilter" aria-label="Ulubione">'+HEART+'</button>'+
    '<button class="ib" data-act="cart" aria-label="Koszyk">'+BAG+'<span class="n" id="cn"></span></button></div></header>'+
  '<main id="top"><div class="wrap"><div class="hero"><div><h1>'+esc(s.tagline||'Witaj w sklepie')+'</h1><p>Wybierz produkty, weź kod zamówienia i otwórz ticket na naszym Discordzie. Sprzedaż wyłącznie dla osób pełnoletnich.</p><a class="btn accent" href="#sklep">Zobacz produkty</a></div>'+feature+'</div></div>'+
  '<section id="sklep"><div class="wrap"><h2>Wszystkie produkty</h2><p class="lead">Cena i dostępność zawsze są potwierdzane przy zamówieniu.</p><div class="tools"><input class="search" id="q" type="search" placeholder="Szukaj produktu" aria-label="Szukaj produktu"><div id="chips"></div></div><div id="grid"></div></div></section>'+
  '<section id="jak"><div class="wrap"><h2>Jak zamówić</h2><p class="lead">Cztery kroki, bez zakładania konta.</p><div class="why">'+
    '<div><h3>1. Koszyk i kod</h3><p>Dodaj produkty, wybierz płatność (BLIK, PayPal lub LTC) i weź swój 12-cyfrowy kod zamówienia.</p></div>'+
    '<div><h3>2. Discord</h3><p>Na naszym serwerze wpisz /zamowienie i wklej kod oraz opis zamówienia.</p></div>'+
    '<div><h3>3. Prywatny ticket</h3><p>Bot otwiera ticket widoczny tylko dla Ciebie i obsługi.</p></div>'+
    '<div><h3>4. Płatność</h3><p>W tickecie dostaniesz dane do płatności. Po potwierdzeniu wpłaty realizujemy zamówienie.</p></div></div></div></section>'+
  '<section id="faq"><div class="wrap"><h2>Najczęstsze pytania</h2><p class="lead">Odpowiedzi możesz zmienić w pliku strony lub poprosić Claude o edycję.</p>'+
    '<details><summary>Czy muszę mieć 18 lat?</summary><p>Tak. Sprzedajemy wyłącznie osobom pełnoletnim.</p></details>'+
    '<details><summary>Jak zapłacić?</summary><p>Przyjmujemy BLIK, PayPal i LTC. Dane do płatności dostaniesz w prywatnym tickecie na Discordzie.</p></details>'+
    '<details><summary>Do czego służy kod zamówienia?</summary><p>To 12-cyfrowy numer Twojego zamówienia. Wpisujesz go w komendzie /zamowienie na Discordzie, a bot otwiera ticket z Twoim zamówieniem.</p></details>'+
    '<details><summary>Mam problem z zamówieniem</summary><p>Napisz w swoim tickecie albo na Discordzie.</p></details></div></section></main>'+
  '<footer><div class="wrap"><span>© '+new Date().getFullYear()+' '+esc(s.name)+'</span><button class="lnk" data-act="legal" data-doc="terms">Regulamin</button><button class="lnk" data-act="legal" data-doc="privacy">Polityka prywatności</button><button class="lnk" data-act="admin">Panel właściciela</button><span class="age">18+ Sprzedaż wyłącznie dla osób pełnoletnich</span></div></footer>';
  renderGrid();badges();
}

function card(p){
  var fav=favs.indexOf(p.id)>-1,out=p.stock===false;
  return '<article class="card'+(out?' out':'')+'" style="--h:'+hue(p.category||p.name)+'"><button class="media" data-act="open" data-id="'+esc(p.id)+'" aria-label="Szczegóły: '+esc(p.name)+'">'+media(p)+(out?'<span class="tag">Brak</span>':'')+'</button>'+

var payMethod=store.get('pay')||'BLIK';

function genCode(){
  var a=new Uint32Array(12),s='';
  (window.crypto||window.msCrypto).getRandomValues(a);
  for(var i=0;i<12;i++)s+=String(a[i]%10);
  return s;
}
function ensureCode(){if(!/^\d{12}$/.test(ocode)){ocode=genCode();store.set('ocode',ocode)}}
function orderLine(){
  var parts=[],total=0;
  cart.forEach(function(c){var p=byId(c.id);if(!p)return;parts.push(c.q+'x '+p.name);total+=p.price*c.q});
  return parts.join('; ')+' | Płatność: '+payMethod+(total>0?' | Razem: '+money(total):'');
}
function openCart(){

  ensureCode();
  var total=0;

    '<div class="fld"><label>Metoda płatności</label><div class="pay">'+['BLIK','PayPal','LTC'].map(function(m){return '<button class="chip" data-act="pay" data-m="'+m+'" aria-pressed="'+(m===payMethod)+'">'+m+'</button>'}).join('')+'</div><p class="note">Dane do płatności dostaniesz w prywatnym tickecie na Discordzie.</p></div>'+
    '<div class="codebox"><div class="note">Twój kod zamówienia</div><div class="code">'+esc(ocode)+'</div><button class="btn sm accent" data-act="copycode">Kopiuj kod</button></div>'+

function copyText(t,okMsg){
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?okMsg:'Zaznacz tekst i skopiuj ręcznie.')}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(okMsg)},fb);return}}catch(e){}
  fb();
}

/* ---------- panel właściciela ---------- */
function toDataUrl(file,maxW,mime,qual){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=function(){rej(new Error('read'))};
    r.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('img'))};
      im.onload=function(){
        var k=Math.min(1,maxW/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        var x=c.getContext('2d');
        if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
        x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL(mime,qual));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

}

  '<div class="fld"><label for="a-flav">Smaki (po przecinku)</label><input id="a-flav" value="'+esc(e.flavors)+'" placeholder="np. Mango, Cola, Mięta"></div></div>'+
  '<div class="fld"><label for="a-desc">Opis</label><textarea id="a-desc">'+esc(e.desc)+'</textarea></div>'+
  '<div class="fld"><label for="a-img">Zdjęcie</label><input id="a-img" type="file" accept="image/*"><div class="prev" id="a-prev">'+(pendingImg?'<img src="'+esc(pendingImg)+'" alt="Podgląd">':'')+'</div>'+(pendingImg?'<button class="btn sm ghost" data-act="a-imgclear" style="margin-top:8px;width:fit-content">Usuń zdjęcie</button>':'')+'</div>'+
  '<div class="fld"><label><input type="checkbox" id="a-stock" style="width:auto;min-height:0" '+(e.stock===false?'':'checked')+'> Dostępny w magazynie</label></div>'+
  '<div class="actions"><button class="btn accent" data-act="a-save">'+(editingId?'Zapisz zmiany':'Dodaj produkt')+'</button>'+(editingId?'<button class="btn ghost" data-act="a-cancel">Anuluj edycję</button>':'')+'</div>'+

function val(id){var el=$(id);return el?el.value:''}
function saveProduct(){
  var name=val('#a-name').trim();
  if(!name){toast('Wpisz nazwę produktu.');return}
  var o={id:editingId||uid(),name:name,category:val('#a-cat').trim()||'Inne',price:parseFloat(val('#a-price').replace(',','.'))||0,puffs:val('#a-puffs').trim(),flavors:val('#a-flav').trim(),desc:val('#a-desc').trim(),img:pendingImg,stock:$('#a-stock').checked};
  if(editingId){draft.products=draft.products.map(function(p){return p.id===editingId?o:p})}else{draft.products.unshift(o)}
  dirty++;editingId=null;pendingImg='';renderAdmin();
  toast('Zapisano w wersji roboczej. Kliknij „Opublikuj zmiany”.');
}
function saveShop(){
  var s=draft.shop;
  s.name=val('#s-name').trim()||'Twój Sklep';s.tagline=val('#s-tag').trim();s.discord=val('#s-dc').trim();s.terms=val('#s-terms');s.privacy=val('#s-priv');
  dirty++;renderAdmin();toast('Ustawienia zapisane w wersji roboczej.');
}
function buildHtml(s){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#site').innerHTML='';c.querySelector('#overlay').innerHTML='';c.querySelector('#gate').innerHTML='';
  var t=c.querySelector('#toast');t.textContent='';t.className='';
  c.removeAttribute('style');c.querySelector('body').removeAttribute('style');
  c.querySelector('title').textContent=s.shop.name||'Sklep';
  c.querySelector('#state').textContent=JSON.stringify(s).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return '<!doctype html>\n'+c.outerHTML;
}
async function publish(){
  if(!dirty){toast('Brak zmian do opublikowania.');return}
  try{
    saveFormsQuiet();
    var a=await window.claude.use('artifact');
    if(!a)throw {code:'unavailable'};
    await a.publish(buildHtml(draft));
  }catch(e){
    var code=e&&e.code;
    if(code==='conflict')return;
    toast(code==='not_writer'||code==='not_granted'?'Tylko właściciel strony może publikować zmiany.':'Nie udało się opublikować. Spróbuj ponownie.');
  }
}
function saveFormsQuiet(){}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  switch(act){
    case 'yes':store.set('age18','1');$('#gate').innerHTML='';break;
    case 'no':$('#gate').innerHTML='<div class="gate"><div class="box"><h1>Brak dostępu</h1><p>Ta strona jest przeznaczona wyłącznie dla osób pełnoletnich.</p></div></div>';break;
    case 'close':closeOverlay();break;
    case 'open':openProduct(id);break;
    case 'fav':var i=favs.indexOf(id);if(i<0)favs.push(id);else favs.splice(i,1);saveFavs();renderGrid();break;
    case 'favfilter':cat=cat==='Ulubione'?'Wszystkie':'Ulubione';renderGrid();var sk=$('#sklep');if(sk)sk.scrollIntoView();break;
    case 'cat':cat=el.getAttribute('data-cat');renderGrid();break;
    case 'add':
      var ex=cart.filter(function(c){return c.id===id})[0];if(ex)ex.q++;else cart.push({id:id,q:1});saveCart();toast('Dodano do koszyka.');break;
    case 'cart':openCart();break;
    case 'inc':cart.forEach(function(c){if(c.id===id)c.q++});saveCart();openCart();break;
    case 'dec':cart.forEach(function(c){if(c.id===id)c.q--});cart=cart.filter(function(c){return c.q>0});saveCart();openCart();break;
    case 'clear':cart=[];ocode='';store.set('ocode','');saveCart();closeOverlay();break;
    case 'copy':var ot=$('#ot');if(ot)copyText(ot.value,'Opis skopiowany.');break;
    case 'copycode':copyText(ocode,'Kod skopiowany.');break;
    case 'pay':payMethod=el.getAttribute('data-m');store.set('pay',payMethod);openCart();break;
    case 'legal':openLegal(el.getAttribute('data-doc'));break;
    case 'admin':openAdmin();break;
    case 'a-edit':editingId=id;pendingImg=(draft.products.filter(function(p){return p.id===id})[0]||{}).img||'';renderAdmin();var sh=$('#overlay .sheet');if(sh)sh.scrollTop=0;break;
    case 'a-cancel':editingId=null;pendingImg='';renderAdmin();break;
    case 'a-save':saveProduct();break;
    case 'a-del':if(window.confirm('Usunąć ten produkt?')){draft.products=draft.products.filter(function(p){return p.id!==id});dirty++;renderAdmin()}break;
    case 'a-stock':draft.products.forEach(function(p){if(p.id===id)p.stock=p.stock===false});dirty++;renderAdmin();break;
    case 'a-imgclear':pendingImg='';renderAdmin();break;
    case 'a-logoclear':draft.shop.logo='';dirty++;renderAdmin();break;
    case 'a-shop':saveShop();break;
    case 'publish':publish();break;
  }
});

  }catch(e){toast('Nie udało się wczytać zdjęcia. Spróbuj inny plik.')}

renderSite();gate();
